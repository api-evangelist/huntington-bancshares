specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Huntington Bancshares
providerId: huntington-bancshares
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Treasury
  - Open Banking
  - ERP Integration
  - Payments
description: Huntington Bank's Treasury Management Connectivity Ecosystem is partner-only. The Apigee
  X-hosted developer portal at hnbdevportal.huntington.com requires an existing Huntington commercial-banking
  relationship for credentials. Pricing for API access is part of the broader treasury management
  / commercial banking service agreement (account analysis fees, transaction fees, ERP-integration
  service charges) rather than a published per-call API tier. The platform supports 500+ interfaces
  and processes 10M+ transaction events daily.
notes: API consumption is bundled with the Huntington commercial banking treasury management agreement.
  No public per-call rate card or developer self-service tier is published.
sources:
  - https://hnbdevportal.huntington.com/
  - https://www.huntington.com/Commercial/treasury-management
plans:
  - id: huntington-bancshares-treasury
    name: Treasury Management API (Partner-Only)
    type: enterprise
    description: API access for Huntington commercial banking customers. Bundled with the treasury
      management contract; not a separately published API tier.
    entries:
      - label: API access
        name: api_access
        type: subscription
        metric: customer
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: bundled with Huntington commercial banking treasury management contract
        userMultiplied: false
      - label: Account analysis / transaction fees
        name: transaction_fees
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: per Huntington commercial banking schedule
        userMultiplied: false
    elements:
      - name: 500+ treasury management interfaces
      - name: ERP integration (SAP, Oracle, NetSuite)
      - name: Real-time transaction visibility
      - name: Apigee X gateway
      - name: 10M+ transaction events per day platform capacity
      - name: Existing Huntington commercial banking relationship required
  - id: huntington-bancshares-developer-portal
    name: Developer Portal (Documentation)
    type: freemium
    description: Documentation-only access to hnbdevportal.huntington.com. Production credentials
      require an active commercial-banking relationship.
    entries:
      - label: Documentation access
        name: docs_access
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: API specifications
      - name: Sandbox documentation
      - name: No production access without contract
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
