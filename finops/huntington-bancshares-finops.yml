description: 'FOCUS-aligned FinOps for Huntington Bank treasury APIs: API access is bundled with
  the commercial banking treasury management contract. Cost surface is account-analysis fees, per-transaction
  fees (ACH, wire, RTP), and ERP-integration service charges rather than per-call API consumption.'
notes: Per-call API pricing is not published; cost flows through the broader Huntington commercial
  banking relationship.
sources:
  - https://hnbdevportal.huntington.com/
  - https://www.huntington.com/Commercial/treasury-management
