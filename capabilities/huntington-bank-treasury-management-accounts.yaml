naftiko: 1.0.0-alpha2
info:
  label: Huntington Bank Treasury Management API — Accounts
  description: 'Huntington Bank Treasury Management API — Accounts. 2 operations. Lead operation: Get treasury accounts. Self-contained
    Naftiko capability covering one Huntington Bancshares business surface.'
  tags:
  - Huntington Bancshares
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HUNTINGTON_BANCSHARES_API_KEY: HUNTINGTON_BANCSHARES_API_KEY
capability:
  consumes:
  - type: http
    namespace: huntington-bank-treasury-management-accounts
    baseUri: https://api.huntington.com/v1
    description: Huntington Bank Treasury Management API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: getaccounts
        method: GET
        description: Get treasury accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-accountId-balances
      path: /accounts/{accountId}/balances
      operations:
      - name: getaccountbalances
        method: GET
        description: Get account balances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          description: The unique account identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.HUNTINGTON_BANCSHARES_API_KEY}}'
  exposes:
  - type: rest
    namespace: huntington-bank-treasury-management-accounts-rest
    port: 8080
    description: REST adapter for Huntington Bank Treasury Management API — Accounts. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: GET
        name: getaccounts
        description: Get treasury accounts
        call: huntington-bank-treasury-management-accounts.getaccounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountid}/balances
      name: accounts-accountid-balances
      description: REST surface for accounts-accountId-balances.
      operations:
      - method: GET
        name: getaccountbalances
        description: Get account balances
        call: huntington-bank-treasury-management-accounts.getaccountbalances
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: huntington-bank-treasury-management-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Huntington Bank Treasury Management API — Accounts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-treasury-accounts
      description: Get treasury accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: huntington-bank-treasury-management-accounts.getaccounts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account-balances
      description: Get account balances
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: huntington-bank-treasury-management-accounts.getaccountbalances
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
